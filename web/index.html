<!doctype html>
<!-- Part of DreyMail, a modified version of Ratatoskr (https://github.com/magnuspihl/Ratatoskr), AGPL-3.0-only; see LICENSE and NOTICE.
     Modified by samschultzponsys, 2026-11-13: page and app title changed from "Ratatoskr" to "DreyMail".
     Modified by samschultzponsys, 2026-11-24: a loading screen until your mail is ready. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DreyMail" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)" />
    <title>DreyMail</title>
    <style>
      /* The loading screen (13.8): shown at once, before any script, until your mail is ready. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #f6f6f4; color: #5b6070; font: 14px system-ui, sans-serif; transition: opacity 0.25s ease; }
      #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(20, 27, 52, 0.25); animation: splash-pulse 1.6s ease-in-out infinite; }
      #splash .bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(34, 211, 238, 0.2); overflow: hidden; }
      #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #22d3ee; animation: splash-slide 1.1s ease-in-out infinite; }
      #splash.gone { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: dark) { #splash { background: #141517; color: #9aa0b0; } }
      @keyframes splash-pulse { 50% { transform: scale(0.95); } }
      @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading DreyMail"><img src="/brand-night.svg" alt="" /><div class="bar"></div><div id="splash-text">Loading your mail…</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
