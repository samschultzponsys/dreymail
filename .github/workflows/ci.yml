# Modified by samschultzponsys, 2026-11-13: no longer runs on main (the Release workflow tests it).
# Modified by samschultzponsys, 2026-11-13: Android app compile check.
name: CI

# main is tested by the Release workflow, so CI covers other branches and pull requests only
# (no duplicate runs).
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  # The Android app compiles (debug build; release builds and signing happen in the Release workflow).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug -PversionName=0.0

