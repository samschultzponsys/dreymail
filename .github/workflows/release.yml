# Modified by samschultzponsys, 2026-11-13: release on push to main when package.json carries a new
# MAJOR.MINOR version; image goes to ghcr.io/samschultzponsys/dreymail; every release gets a GitHub Release.
name: Release

# Every push to main runs the tests. When package.json carries a version that has no tag yet
# (package.json "1.3.0" -> release v1.3), it also publishes:
#   - the image ghcr.io/<owner>/dreymail tagged 1.3 and latest
#   - the tag v1.3 and a GitHub Release (no files attached; notes generated from commits)
# To release: bump package.json to the next version (scripts/release-version.sh next) and push.
# Versions are MAJOR.MINOR and roll over after .9 (1.9 -> 2.0).
#
# Kept within GitHub's free tier: public repo (Actions minutes and public GHCR images are free),
# one job, no artifacts uploaded, Docker layer cache in the free Actions cache.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once could both try to publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          version="$(scripts/release-version.sh current)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; tests only."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will release v$version."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
      - if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a failed build never leaves a tag or release without an image behind it.
      - name: Publish the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >
          gh release create "v$VERSION"
          --target "$GITHUB_SHA"
          --title "dreymail v$VERSION"
          --generate-notes
          --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\` (also \`latest\`). See CHANGES.md for the dated change log."
