# Modified by samschultzponsys, 2026-11-13: release on push to main when package.json carries a new
# MAJOR.MINOR version; image goes to ghcr.io/samschultzponsys/dreymail; every release gets a GitHub Release.
# Modified by samschultzponsys, 2026-11-13: desktop apps (deb, rpm, flatpak, Windows installer) built and attached to each release.
# Modified by samschultzponsys, 2026-11-15: runs queue per version (a newer push no longer drops an older version's
# release); `latest` only for the version on main; a missed version can be released by hand with its commit.
# Modified by samschultzponsys, 2026-11-15: Node 24 (image, CI and GitHub Actions on their Node 24 versions).
# Modified by samschultzponsys, 2026-11-27: calendar versions YY.M.N; desktop files also under the two-part names apps before 26.11 look for.
name: Release

# Every push to main runs the tests. When package.json carries a version that has no tag yet
# (package.json "26.11.2" -> release v26.11.2), it also publishes:
#   - the image ghcr.io/<owner>/dreymail tagged 26.11.2 and latest
#   - the tag v26.11.2 and a GitHub Release, with the desktop apps and the Android app attached
# To release: bump package.json to the next version (scripts/release-version.sh next) and push.
# A version whose release never ran (e.g. pushed while another was building): push its tag
# (git tag vX.Y <commit> && git push origin vX.Y), then run this workflow by hand (Actions → Release →
# Run workflow) with that full commit SHA in "sha". GitHub doesn't let the workflow's token create a
# tag on an older commit whose workflow files differ from main's, hence the tag by hand.
# Versions are YY.M.N since 26.11: year, month, and a count from 0 each month (26.11.0, 26.11.1, …
# 26.12.0). Before that they were MAJOR.MINOR (… 14.7).
#
# Kept within GitHub's free tier: public repo (Actions minutes and public GHCR images are free),
# one job, no artifacts uploaded, Docker layer cache in the free Actions cache.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA on main to release (for a version whose release never ran). Empty: the tip of main."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Which commit and version this run is about. Kept apart so the release job can queue per version:
  # two runs of the same version wait for each other (only one publishes), different versions don't
  # drop each other's runs.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"; exit 1
          fi
          version="$(scripts/release-version.sh current)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Released = a GitHub Release exists (a tag alone may have been pushed by hand for a
          # missed version, see the top of this file).
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; tests only."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will release v$version."
          fi

  release:
    needs: version
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.version.outputs.value }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ needs.version.outputs.value }}
      publish: ${{ steps.again.outputs.publish }}
      sha: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}

      # A run of the same version may have published while this one waited.
      - name: Still unreleased?
        id: again
        env:
          VERSION: ${{ needs.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.version.outputs.publish }}" = true ] && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

      # `latest` only for the version main carries now, so an older version released late (or by
      # hand) never takes it back.
      - name: Latest?
        id: latest
        if: steps.again.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          git fetch -q origin main
          main="$(git show origin/main:package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          if [ "$main" = "$VERSION" ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.again.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.again.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.again.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.value }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.value == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
      - if: steps.again.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a failed build never leaves a tag or release without an image behind it.
      - name: Publish the GitHub Release
        if: steps.again.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.value }}
          SHA: ${{ needs.version.outputs.sha }}
        run: >
          gh release create "v$VERSION"
          --target "$SHA"
          --title "DreyMail v$VERSION"
          --generate-notes
          --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\`. See CHANGES.md for the dated change log."

  # ---- desktop apps, attached to the GitHub Release just created ------------------------------
  # File names carry the version: DreyMail-26.11.2-amd64.deb, DreyMail-26.11.2-x86_64.rpm,
  # DreyMail-26.11.2-x86_64.flatpak, DreyMail-Setup-26.11.2-x64.exe. Release assets are free on GitHub.
  # Desktop apps from before 26.11 look for two-part names (DreyMail-26.11-amd64.deb): each file is
  # attached under that name too, so they update themselves to the new versions. Drop the copies
  # once every desktop app runs 26.11 or later.
  desktop-linux:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use the release version
        run: npm version "$(node -p "require('../package.json').version")" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Build deb and rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          npx electron-builder --linux deb rpm --x64 --publish never "--config.artifactName=DreyMail-${VERSION}-\${arch}.\${ext}"
      - name: Build flatpak
        # Needs Flathub; a hiccup there must not hold back the other packages.
        continue-on-error: true
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          npx electron-builder --linux flatpak --x64 --publish never "--config.artifactName=DreyMail-${VERSION}-\${arch}.\${ext}"
      - name: Attach to the release
        run: |
          files="dist/*.deb dist/*.rpm $(ls dist/*.flatpak 2>/dev/null)"
          # The same files under the two-part names apps before 26.11 look for (see above).
          for f in $files; do cp "$f" "${f/-$VERSION-/-${VERSION%.*}-}"; done
          gh release upload "v$VERSION" $files $(for f in $files; do echo "${f/-$VERSION-/-${VERSION%.*}-}"; done) --clobber --repo "$GITHUB_REPOSITORY"

  desktop-windows:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use the release version
        run: npm version "$(node -p "require('../package.json').version")" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never "--config.nsis.artifactName=DreyMail-Setup-${VERSION}-\${arch}.\${ext}"
      - name: Attach to the release
        run: |
          # Also under the two-part name the desktop app before 26.11 looks for (see desktop-linux).
          for f in dist/*.exe; do cp "$f" "${f/-$VERSION-/-${VERSION%.*}-}"; done
          gh release upload "v$VERSION" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"

  # Android app: DreyMail-26.11.2.apk, signed with the key in the repository secrets
  # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
  # Every release must use the same key, or phones can't update. Without the secrets the APK is
  # skipped with a warning (the rest of the release is unaffected).
  android:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the Android app is not built for this release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dreymail.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.signed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - if: steps.key.outputs.signed == 'true'
        uses: gradle/actions/setup-gradle@v5
      - name: Build and attach the APK
        if: steps.key.outputs.signed == 'true'
        env:
          DREYMAIL_KEYSTORE_FILE: ${{ runner.temp }}/dreymail.jks
          DREYMAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DREYMAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DREYMAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "DreyMail-$VERSION.apk"
          gh release upload "v$VERSION" "DreyMail-$VERSION.apk" --clobber --repo "$GITHUB_REPOSITORY"

