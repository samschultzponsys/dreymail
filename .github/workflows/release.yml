# Copyright (C) Magnus Pihl and contributors. Licensed under the GNU AGPL v3.0 only; see LICENSE and NOTICE.
# Modified by samschultzponsys, 2026-11-13: release on push to main when package.json carries a new
# MAJOR.MINOR version; image goes to ghcr.io/samschultzponsys/dreymail; every release gets a GitHub Release.
# Modified by samschultzponsys, 2026-11-13: desktop apps (deb, rpm, flatpak, Windows installer) built and attached to each release.
name: Release

# Every push to main runs the tests. When package.json carries a version that has no tag yet
# (package.json "1.3.0" -> release v1.3), it also publishes:
#   - the image ghcr.io/<owner>/dreymail tagged 1.3 and latest
#   - the tag v1.3 and a GitHub Release (no files attached; notes generated from commits)
# To release: bump package.json to the next version (scripts/release-version.sh next) and push.
# Versions are MAJOR.MINOR and roll over after .9 (1.9 -> 2.0).
#
# Kept within GitHub's free tier: public repo (Actions minutes and public GHCR images are free),
# one job, no artifacts uploaded, Docker layer cache in the free Actions cache.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once could both try to publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          version="$(scripts/release-version.sh current)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; tests only."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will release v$version."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
      - if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a failed build never leaves a tag or release without an image behind it.
      - name: Publish the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >
          gh release create "v$VERSION"
          --target "$GITHUB_SHA"
          --title "DreyMail v$VERSION"
          --generate-notes
          --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\` (also \`latest\`). See CHANGES.md for the dated change log."

  # ---- desktop apps, attached to the GitHub Release just created ------------------------------
  # File names carry the version: DreyMail-1.7-amd64.deb, DreyMail-1.7-x86_64.rpm,
  # DreyMail-1.7-x86_64.flatpak, DreyMail-Setup-1.7-x64.exe. Release assets are free on GitHub.
  desktop-linux:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use the release version
        run: npm version "$(node -p "require('../package.json').version")" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Build deb and rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          npx electron-builder --linux deb rpm --x64 --publish never "--config.artifactName=DreyMail-${VERSION}-\${arch}.\${ext}"
      - name: Build flatpak
        # Needs Flathub; a hiccup there must not hold back the other packages.
        continue-on-error: true
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          npx electron-builder --linux flatpak --x64 --publish never "--config.artifactName=DreyMail-${VERSION}-\${arch}.\${ext}"
      - name: Attach to the release
        run: gh release upload "v$VERSION" dist/*.deb dist/*.rpm $(ls dist/*.flatpak 2>/dev/null) --clobber --repo "$GITHUB_REPOSITORY"

  desktop-windows:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use the release version
        run: npm version "$(node -p "require('../package.json').version")" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never "--config.nsis.artifactName=DreyMail-Setup-${VERSION}-\${arch}.\${ext}"
      - name: Attach to the release
        run: gh release upload "v$VERSION" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"

