<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>dreymail</title>
  <!-- dreymail icon: an envelope tucked into a drey (a squirrel's nest of twigs).
       Copyright (C) 2026 samschultzponsys. Part of dreymail, licensed AGPL-3.0-only (see LICENSE). -->
  <defs>
    <clipPath id="tile"><rect x="24" y="24" width="976" height="976" rx="200"/></clipPath>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="200" fill="#fdeee6"/>
  <g clip-path="url(#tile)">
    <!-- envelope, tilted, sitting in the nest -->
    <g transform="rotate(-9 512 430)">
      <rect x="262" y="250" width="500" height="350" rx="34" fill="#c2410c"/>
      <path d="M 290 282 L 512 452 L 734 282" fill="none" stroke="#fdeee6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- twig ends poking out of the nest -->
    <g stroke="#3a1d10" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M 130 500 L 262 560"/>
      <path d="M 150 610 L 270 590"/>
      <path d="M 894 498 L 760 560"/>
      <path d="M 880 620 L 756 592"/>
    </g>
    <!-- the drey: a bowl of woven twigs -->
    <path d="M 168 548 C 300 600 724 600 856 548 C 850 760 700 864 512 864 C 324 864 174 760 168 548 Z" fill="#3a1d10"/>
    <g stroke="#7a4524" stroke-width="18" stroke-linecap="round" fill="none">
      <path d="M 200 610 C 360 680 640 690 830 600"/>
      <path d="M 220 690 C 400 760 640 760 800 680"/>
      <path d="M 280 770 C 420 830 620 830 740 760"/>
      <path d="M 230 600 C 330 720 470 800 620 846"/>
      <path d="M 800 610 C 700 730 560 800 400 846"/>
    </g>
    <!-- rim -->
    <path d="M 160 548 C 300 606 724 606 864 548" fill="none" stroke="#5c2e16" stroke-width="40" stroke-linecap="round"/>
  </g>
  <rect x="24" y="24" width="976" height="976" rx="200" fill="none" stroke="#3a1d10" stroke-width="48"/>
</svg>
