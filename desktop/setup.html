<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>DreyMail</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6a65; --border: #d3d2cc; --cyan: #22d3ee; --navy: #141b34; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141517; --card: #1b1c1f; --text: #ececea; --muted: #a1a09a; --border: #383940; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px; }
      .card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; text-align: center; }
      h1 { margin: 12px 0 4px; font-size: 22px; }
      p { margin: 0 0 18px; color: var(--muted); }
      label { display: block; text-align: left; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
      input { width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; }
      input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.25); }
      button { margin-top: 14px; width: 100%; height: 40px; border: 0; border-radius: 8px; background: var(--cyan); color: var(--navy); font: inherit; font-weight: 600; cursor: pointer; }
      .error { color: #ef4444; min-height: 1.5em; margin-top: 10px; font-size: 13px; }
      img { width: 64px; height: 64px; }
    </style>
  </head>
  <body>
    <form class="card" id="form">
      <img id="logo" alt="" />
      <h1>DreyMail</h1>
      <p>Enter the address of your DreyMail server.</p>
      <label for="url">Server address</label>
      <input id="url" type="url" placeholder="https://mail.example.com" required autofocus />
      <button type="submit">Connect</button>
      <div class="error" id="error"></div>
    </form>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('logo').src = params.get('icon') || '';
      document.getElementById('url').value = params.get('current') || '';
      document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = document.getElementById('url').value.trim();
        try {
          const u = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
          if (!/^https?:$/.test(u.protocol)) throw new Error();
          // The main process picks this up from the navigation and stores it.
          location.href = `dreymail-setup://save?url=${encodeURIComponent(u.origin)}`;
        } catch {
          document.getElementById('error').textContent = 'That is not a valid address.';
        }
      });
    </script>
  </body>
</html>
